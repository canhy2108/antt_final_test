name: budgetbee
description: "BudgetBee — Smart Personal Finance Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Navigation ───────────────────────────────────────────
  go_router: ^14.0.0

  # ── State Management ─────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Network & API ────────────────────────────────────────
  dio: ^5.4.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  pretty_dio_logger: ^1.3.1

  # ── Secure Storage & Auth ────────────────────────────────
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # ── Database (Offline-First) ──────────────────────────────
  # isar: ^3.1.0+1       ← Tạm tắt: isar 3.x không tương thích AGP 8+
  # isar_flutter_libs    ← Sẽ upgrade lên isar 4.x ở Sprint 4
  path_provider: ^2.1.4

  # ── UI & Design ───────────────────────────────────────────
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  pinput: ^5.0.0
  gap: ^3.0.1
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8

  # ── Utilities ─────────────────────────────────────────────
  intl: 0.20.2
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  crypto: ^3.0.3
  uuid: ^4.4.2
  collection: ^1.18.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Camera & eKYC ─────────────────────────────────────────
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  # isar_generator: ^3.1.0+1  ← Tắt cùng isar 3.x

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
