# API-only stack — DB + Laravel + Nginx. No React web frontend.
# Use this when the mobile app is the only consumer and the host can't
# reach npm registry inside the web build (slow npm = build timeouts).
#
# Usage:
#   docker compose -f docker/docker-compose.api-only.yml --env-file docker/.env -p budgetbee_dev up -d --build

services:
  db:
    image: mysql:8.2.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Port 3306 NOT exposed to host — internal-only access via the
    # `bee_dev` network. Uncomment if you need TablePlus/Workbench access.
    # ports:
    #   - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    volumes:
      - db_data_dev:/var/lib/mysql
    networks:
      - bee_dev

  webserver:
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    command: sh -c "docker-php-ext-enable opcache 2>/dev/null; composer install --no-interaction --prefer-dist --optimize-autoloader && php artisan key:generate --force --no-interaction && until php artisan migrate --force --seed 2>/dev/null; do echo 'Waiting for DB...'; sleep 3; done && php artisan config:cache && php artisan route:cache && php-fpm"
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ../api:/var/www/html
      # Bypass slow Windows bind-mount for vendor/ and bootstrap/cache by
      # promoting them to native Docker volumes. ~10x faster autoload.
      - vendor_dev:/var/www/html/vendor
      - bootstrap_cache_dev:/var/www/html/bootstrap/cache
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bee_dev

  nginx-dev:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../api:/var/www/html
    depends_on:
      - webserver
    restart: unless-stopped
    networks:
      - bee_dev

networks:
  bee_dev:
    driver: bridge

volumes:
  db_data_dev:
  vendor_dev:
  bootstrap_cache_dev:
