# Dev docker-compose — builds images from local source so the bug fixes
# in this branch actually run. The production compose at docker-compose.yml
# pulls pre-built images from ghcr.io which do NOT include local changes.
#
# Usage (from repo root):
#   docker compose -f docker/docker-compose.dev.yml up -d --build
#
# Stack:
#   - db        : MySQL 8 (port 3306 exposed for host tooling like TablePlus)
#   - webserver : PHP-FPM Laravel API (mount ../api as live-reload volume)
#   - web       : Vite dev server (mount ../web)
#   - nginx-dev : simple reverse proxy on port 8080 → API + Web
#
# No HTTPS in dev. Production stack at docker-compose.yml keeps SSL + nginx
# with security headers.

services:
  db:
    image: mysql:8.2.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    volumes:
      - db_data_dev:/var/lib/mysql
    networks:
      - bee_dev

  webserver:
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    command: sh -c "composer install --no-interaction --prefer-dist --optimize-autoloader && php artisan key:generate --force --no-interaction && php artisan migrate --force --seed && php-fpm"
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - ../api:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bee_dev

  web:
    build:
      context: ../web
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    volumes:
      - ../web:/var/www/html
      - /var/www/html/node_modules
    restart: unless-stopped
    networks:
      - bee_dev

  nginx-dev:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../api:/var/www/html
    depends_on:
      - webserver
      - web
    restart: unless-stopped
    networks:
      - bee_dev

networks:
  bee_dev:
    driver: bridge

volumes:
  db_data_dev:
