# Dev-only nginx reverse proxy: no HTTPS, no rate-limiting noise.
# Mirrors the production routing (api → PHP-FPM, everything else → Vite).

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /login {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /setup {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass webserver:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Docker-on-Windows bind mounts are slow (9p/SMB); first request
        # spends 50+ seconds loading Laravel before OPcache warms. After
        # that subsequent requests are sub-second.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }

    # Fallback: route everything else to Laravel public/ so /api works and
    # bare /  returns a minimal index. If the React `web` container exists
    # in the stack, switch this back to `proxy_pass http://web:3000`.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
